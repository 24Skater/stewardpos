# Demo/Development Docker Compose Configuration
# This is a simplified setup for quick demos and local development
# For production deployments, use the environment-specific configurations in environments/

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: stewardpos-db-demo
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stewardpos}
      POSTGRES_USER: ${POSTGRES_USER:-stewardpos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo_password_123}
    volumes:
      - postgres_data_demo:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stewardpos_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stewardpos-demo-network

  # Object storage: Versity S3 Gateway, an Apache-2.0 S3 server that keeps each
  # object as a plain file under /data/<bucket>/ on the s3_data volume, so a
  # backup is a copy of a directory. It replaced MinIO when MinIO stopped
  # publishing images anyone can pull (quay.io and Docker Hub both answer 401).
  # It opens one port, the S3 API, and refuses to start without both
  # credentials, so there is no anonymous mode to fall into. Pinned: a floating
  # tag is a dependency on someone else's Tuesday.
  s3:
    image: versity/versitygw:v1.9.0
    container_name: stewardpos-storage-demo
    restart: unless-stopped
    command: ["posix", "/data"]
    environment:
      ROOT_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-stewardpos}
      ROOT_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-CHANGE_THIS_PASSWORD}
      VGW_HEALTH: /health
      VGW_QUIET: "true"
    volumes:
      - s3_data_demo:/data
    ports:
      - "9000:7070"
    depends_on:
      s3-createbucket:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:7070/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - stewardpos-demo-network

  # A bucket is a top-level directory on the gateway's volume. Making it before
  # the gateway starts means STORAGE_ADAPTER=s3 on a fresh volume passes the
  # backend's startup check on the bucket. The name is checked first: it
  # becomes a path.
  s3-createbucket:
    image: versity/versitygw:v1.9.0
    entrypoint:
      - sh
      - -c
      - |
        case "$$S3_BUCKET" in
          ""|*[!a-z0-9.-]*) echo "S3_BUCKET must be lowercase letters, digits, dots and hyphens" >&2; exit 1 ;;
        esac
        mkdir -p "/data/$$S3_BUCKET" && echo "bucket ready: $$S3_BUCKET"
    environment:
      S3_BUCKET: ${S3_BUCKET:-stewardpos}
    volumes:
      - s3_data_demo:/data
    network_mode: none
    restart: "no"

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stewardpos-backend-demo
    restart: unless-stopped
    environment:
      # Server
      # A demo is not a production install, and saying so matters now that the
      # label carries weight: this profile ships a published administrator
      # (admin@demo.local / DemoPass!1) and a placeholder JWT secret, and the
      # backend refuses both under NODE_ENV=production. Which is correct — the
      # mislabelling was the bug.
      NODE_ENV: development
      PORT: 3001
      HOST: 0.0.0.0
      
      # Database
      DB_ADAPTER: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-stewardpos}
      DB_USER: ${DB_USER:-stewardpos_user}
      DB_PASSWORD: ${DB_PASSWORD:-demo_password_123}
      
      # JWT
      JWT_SECRET: ${JWT_SECRET:-demo_jwt_secret_min_32_characters_long_change_me}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      
      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://localhost:3001}
      
      # Rate Limiting
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      # One nginx sits in front; without this every client shares one
      # rate-limit bucket because they all appear to come from the proxy.
      TRUST_PROXY: 1
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-3000}
      RATE_LIMIT_MAX_LOGIN_ATTEMPTS: ${RATE_LIMIT_MAX_LOGIN_ATTEMPTS:-10}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE: /app/logs/app.log
      
      # Auto-seed database on first startup (useful for demos)
      AUTO_SEED: ${AUTO_SEED:-true}
    volumes:
      - backend_logs_demo:/app/logs
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - stewardpos-demo-network

  # Frontend Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001}
        # Prints the seeded demo login on the sign-in form. Demo profile only.
        VITE_DEMO_MODE: "true"
    container_name: stewardpos-frontend-demo
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # API Configuration
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:3001}
      
      # Features
      - VITE_APP_ENV=demo
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      s3:
        condition: service_healthy
    networks:
      - stewardpos-demo-network

volumes:
  postgres_data_demo:
    driver: local
  s3_data_demo:
    driver: local
  backend_logs_demo:
    driver: local

networks:
  stewardpos-demo-network:
    driver: bridge

