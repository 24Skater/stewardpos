# Base Docker Compose Configuration
# This is the base configuration used by environment-specific overrides
# For a standalone demo, use docker-compose.demo.yml instead

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stewardpos}
      POSTGRES_USER: ${POSTGRES_USER:-stewardpos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-stewardpos_secure_password_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stewardpos_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stewardpos-network

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-CHANGE_THIS_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - stewardpos-network

  # Creates the bucket MinIO does not create for itself, then exits. Without
  # this, switching STORAGE_ADAPTER to s3 on a fresh volume fails the backend's
  # startup check on a bucket that was never made.
  minio-createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      echo 'bucket ready: '$${S3_BUCKET}
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-CHANGE_THIS_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-stewardpos}
    restart: "no"
    networks:
      - stewardpos-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      # Pin the container clock to UTC.
      #
      # Postgres `TIMESTAMP WITHOUT TIME ZONE` columns carry no offset, and
      # node-postgres both serialises a JS Date into one and parses one back
      # using the *process* timezone. Those two shifts cancel out, so a
      # round-trip through the app looks correct on any host - right up until a
      # client-written value is compared against something Postgres computed
      # itself (NOW(), EXTRACT), at which point they disagree by the offset. A
      # register's hourly sales landed four hours out exactly this way.
      #
      # Pinning UTC removes the ambiguity rather than relying on two wrongs
      # continuing to cancel. Anything reading this database with another tool
      # then sees the instants the application meant.
      TZ: UTC
      # Server
      # Development, because that is what this stack is.
      #
      # It defaulted to `production`, which was never true of it: the CORS
      # origins are localhost, every port is published to the host, and the
      # database password and JWT secret are placeholders committed to this
      # repository. The label only became load-bearing once production started
      # meaning something — the backend now refuses to boot on those
      # placeholders, and the seeder refuses to create the demo administrator —
      # at which point this file could not start its own stack.
      #
      # Set NODE_ENV=production here only if you have also set real secrets.
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3001
      HOST: 0.0.0.0
      
      # Database
      DB_ADAPTER: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      # Note: In dev, this connects to the postgres service in the same Docker network
      DB_NAME: ${DB_NAME:-stewardpos}
      DB_USER: ${DB_USER:-stewardpos_user}
      DB_PASSWORD: ${DB_PASSWORD:-stewardpos_secure_password_123}
      
      # JWT
      JWT_SECRET: ${JWT_SECRET:-CHANGE_THIS_MIN_32_CHARACTERS_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      
      # CORS
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8081,http://localhost:5174,http://localhost:3002,http://frontend:80}
      
      # Rate Limiting
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      # One nginx sits in front; without this every client shares one
      # rate-limit bucket because they all appear to come from the proxy.
      TRUST_PROXY: 1
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-3000}
      RATE_LIMIT_MAX_LOGIN_ATTEMPTS: ${RATE_LIMIT_MAX_LOGIN_ATTEMPTS:-10}
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE: /app/logs/app.log
      
      # Auto-seed database on first startup (set to false to prevent duplicate seeding)
      AUTO_SEED: ${AUTO_SEED:-false}
      
      # Uploads. STORAGE_ADAPTER=localstorage keeps images on the
      # backend_uploads volume, which is right until there is more than one
      # backend replica. Set it to s3 to use the MinIO container below, or any
      # real S3 bucket by pointing S3_ENDPOINT elsewhere (or dropping it).
      #
      # These used to be six MINIO_* variables that named nothing the backend
      # read; the app looks for S3_*.
      STORAGE_ADAPTER: ${STORAGE_ADAPTER:-localstorage}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-stewardpos}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-CHANGE_THIS_PASSWORD}
    volumes:
      - backend_logs:/app/logs
      - backend_uploads:/app/uploads
    ports:
      - "${BACKEND_PORT:-3002}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - stewardpos-network

  # Frontend Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3002}
        # Prints the seeded demo credentials (admin@demo.local / DemoPass!1)
        # on the sign-in form.
        #
        # It has to be a build arg: Vite inlines VITE_* at build time, so the
        # `environment:` block below cannot reach an already-built bundle. Without
        # this line the toggle was unreachable from this file entirely - the flag
        # existed in the Dockerfile and in Login.tsx, but only docker-compose.demo.yml
        # ever passed it, so this stack could never display the hint at any setting.
        #
        # Defaults off, so a real install still never advertises a known account.
        # Turn it on with: VITE_DEMO_MODE=true docker compose up -d --build frontend
        VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8081}:80"
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:3002}
      - VITE_APP_ENV=${VITE_APP_ENV:-production}
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - stewardpos-network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  backend_logs:
    driver: local
  backend_uploads:
    driver: local

networks:
  stewardpos-network:
    driver: bridge

