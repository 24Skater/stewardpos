# Security headers, in a file that has to be included everywhere they matter.
#
# This is not DRY-for-its-own-sake. nginx inherits `add_header` from an outer
# block *only if the inner block declares no `add_header` of its own* - one
# `add_header Cache-Control ...` in a location silently discards every security
# header from the server block. There is no warning and no error; the headers
# simply stop being sent.
#
# That had happened here. `location = /index.html` set three cache headers, and
# `location /`'s `try_files` rewrites every SPA route internally to
# `/index.html` - so the document that loads the whole application was served
# with no CSP, no X-Frame-Options, no nosniff, and no HSTS. The static-asset and
# /uploads locations had dropped them too. The directives were present in
# nginx.conf and correct; nothing they described was ever true.
#
# So they live here, and every location that sets any header of its own
# includes this file. `nginx.conf` has a test asserting exactly that
# (`src/test/__tests__/csp.test.ts`), because the failure mode is invisible in
# both the config and the browser until somebody thinks to look at the headers.

# `script-src` has no 'unsafe-inline'. The Vite build emits a single
# `<script type="module" src=...>` and no inline script at all, so the
# allowance bought nothing and cost the main thing a CSP is for: an injected
# `<script>alert(1)</script>` is inert without it.
#
# `style-src` keeps 'unsafe-inline'. React and Radix set `style=` on the
# elements they position (popovers, tooltips, the scroll area), and a static
# file server has no nonce to hand them.
#
# fonts.googleapis.com / fonts.gstatic.com are named because index.html loads
# Inter, Playfair Display and JetBrains Mono from them. The previous policy did
# not name either, which never showed up as a problem for a precise reason: the
# policy was never sent (see the inheritance note above), so nothing enforced
# it. Fixing the inheritance bug alone would therefore have *broken the fonts* -
# verified by serving the built app under the old policy, which refuses all
# three stylesheets and loads zero font faces. The two had to be fixed together.
#
# `connect-src` keeps http://localhost:* for the dev and demo compose
# topologies, which build the bundle with an absolute VITE_API_BASE_URL. Under
# docker-compose.prod.yml that value is "" and every call is same-origin, so
# 'self' covers it there.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: https: http://localhost:* http://backend:*; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' http://localhost:* https:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
# Parity with the Caddyfile, which has sent this in production all along.
# A POS terminal has no business reaching for a camera or a location.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
