# StewardPOS — production stack.
#
#   docker compose -f docker-compose.prod.yml up -d
#
# Standalone, not an overlay on docker-compose.yml. That is deliberate: the base
# file is a development stack and publishes Postgres, MinIO and the backend on
# host ports. An overlay inherits those unless every one is overridden, and
# forgetting one exposes a database to the internet. A separate file cannot
# inherit a mistake.
#
# Only Caddy publishes ports. Everything else talks over the internal network,
# so there is no host-level path to Postgres, MinIO or the API except through
# TLS on 443.
#
# Fill .env from .env.prod.example first — the backend refuses to start in
# production on the placeholder secrets this repository ships.

services:
  # TLS termination and the only way in.
  #
  # Caddy obtains and renews Let's Encrypt certificates by itself given a domain
  # that resolves to this host and ports 80/443 reachable. No cron, no certbot
  # renewal hook to forget.
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN must be set to the public hostname, e.g. pos.example.org}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL must be set; Let's Encrypt uses it for expiry warnings}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and account keys. Losing this volume means re-issuing certs
      # and, often enough, hitting Let's Encrypt's rate limits while doing it.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - stewardpos

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stewardpos}
      POSTGRES_USER: ${POSTGRES_USER:-stewardpos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No `ports:`. The database is reachable only from this network; back it up
    # with scripts/backup.sh, which runs pg_dump inside the container.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-stewardpos_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - stewardpos

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - stewardpos

  # Creates the bucket MinIO does not create for itself, then exits. Without it,
  # STORAGE_ADAPTER=s3 on a fresh volume fails the backend's startup check on a
  # bucket that was never made.
  minio-createbucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${S3_BUCKET} &&
      echo 'bucket ready: '$${S3_BUCKET}
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER must be set}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
      S3_BUCKET: ${S3_BUCKET:-stewardpos}
    restart: "no"
    networks:
      - stewardpos
  backend:
    # Pull a published image when IMAGE_TAG is set, build from source otherwise.
    #
    #   IMAGE_TAG=1.0.0 docker compose -f docker-compose.prod.yml up -d
    #
    # Compose uses `image:` as the pull target and `build:` as the fallback, so
    # both can be declared: with a real tag it pulls, and with the default
    # `local` it finds nothing published and builds. Pinning a version is the
    # better habit — it is what makes a rollback a one-line change.
    image: ghcr.io/24skater/stewardpos-backend:${IMAGE_TAG:-local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    pull_policy: ${IMAGE_PULL_POLICY:-missing}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0

      DB_ADAPTER: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-stewardpos}
      DB_USER: ${POSTGRES_USER:-stewardpos_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a value you generated}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}

      # Encrypts the payment credentials held in `settings.config`.
      #
      # This was absent, which made it impossible to turn on: the backend reads
      # `process.env.CREDENTIALS_KEY`, compose passes only what is listed here,
      # and there is no `env_file`. Setting it in `.env` did nothing at all, so
      # every production install has been holding its Stripe or Square key in
      # clear text with no way to stop.
      #
      # Unlike the other credentials it can have no database fallback — it is
      # the key those values are encrypted *with*, so keeping it beside them
      # would defeat the point. The environment is the only place it can live.
      #
      # Optional here rather than required, matching the application: an
      # existing install must not refuse to boot on upgrade over a condition it
      # has had all along. The backend warns at startup when it is unset. On a
      # stack you run on someone else's behalf, set it.
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:-}

      # Cost factor for every bcrypt hash: passwords, PINs, device tokens,
      # override grants. Documented as configurable in env.example, and until
      # now not actually settable in production.
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-10}

      # Per-account lockout on password sign-in. The rate limits below count per
      # IP; these are the half that counts per account.
      PASSWORD_MAX_FAILURES: ${PASSWORD_MAX_FAILURES:-10}
      PASSWORD_LOCKOUT_MS: ${PASSWORD_LOCKOUT_MS:-900000}

      # One origin. The SPA and the API are served from the same hostname, so
      # this is the only value CORS ever needs to allow.
      CORS_ORIGIN: https://${DOMAIN}

      # Exactly one proxy sits in front of the API: Caddy routes /api straight
      # to this service rather than through the frontend's nginx. Getting this
      # number wrong is not cosmetic — too low and every client shares one
      # rate-limit bucket; too high and a client can spoof its address past the
      # limits with a forged X-Forwarded-For.
      TRUST_PROXY: 1
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-3000}
      RATE_LIMIT_MAX_LOGIN_ATTEMPTS: ${RATE_LIMIT_MAX_LOGIN_ATTEMPTS:-10}
      # The other three brute-force budgets. All five limiters existed; only two
      # of them could be tuned in production, which is a strange place to draw
      # the line given these guard a device-pairing code and two PIN keypads.
      RATE_LIMIT_MAX_PAIR_ATTEMPTS: ${RATE_LIMIT_MAX_PAIR_ATTEMPTS:-10}
      RATE_LIMIT_MAX_SHIFT_ATTEMPTS: ${RATE_LIMIT_MAX_SHIFT_ATTEMPTS:-10}
      RATE_LIMIT_MAX_OVERRIDE_ATTEMPTS: ${RATE_LIMIT_MAX_OVERRIDE_ATTEMPTS:-10}

      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FILE: /app/logs/app.log
      # Rotation. Without these the file transport keeps its defaults, which are
      # fine — but a volume that fills months after install is a bad way to find
      # out the knobs were unreachable.
      LOG_MAX_SIZE_MB: ${LOG_MAX_SIZE_MB:-20}
      LOG_MAX_FILES: ${LOG_MAX_FILES:-5}

      # Never on a real install. The seed writes an administrator whose password
      # is published in this repository; the backend refuses it in production
      # regardless, and this states the intent as well.
      AUTO_SEED: "false"

      # Uploads. localstorage keeps images on the backend_uploads volume and is
      # correct for a single backend; set STORAGE_ADAPTER=s3 to put them in the
      # MinIO container below, or in a real bucket by changing S3_ENDPOINT.
      #
      # These were six MINIO_* variables naming nothing the backend read.
      STORAGE_ADAPTER: ${STORAGE_ADAPTER:-localstorage}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-stewardpos}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}

      EMAIL_ADAPTER: ${EMAIL_ADAPTER:-console}
      EMAIL_FROM: ${EMAIL_FROM:-noreply@${DOMAIN}}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    volumes:
      - backend_logs:/app/logs
      # Uploads live on a volume rather than in the image: MinIO is optional and
      # the disk path is the default, so this is where a shop's product photos
      # and receipt logos actually are. It is in the backup script for that
      # reason.
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
    networks:
      - stewardpos

  frontend:
    image: ghcr.io/24skater/stewardpos-frontend:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Empty on purpose: the SPA then calls `/api/...` relative to whatever
        # origin served it, which is the same origin. Baking an absolute URL in
        # would tie the built image to one hostname and break the moment the
        # domain changes.
        VITE_API_BASE_URL: ""
    pull_policy: ${IMAGE_PULL_POLICY:-missing}
    restart: unless-stopped
    environment:
      - VITE_APP_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    networks:
      - stewardpos

volumes:
  postgres_data:
  minio_data:
  backend_logs:
  backend_uploads:
  caddy_data:
  caddy_config:

networks:
  stewardpos:
    driver: bridge
