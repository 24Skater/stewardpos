server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers.
    #
    # Included rather than written inline, and included AGAIN in every location
    # below that sets a header of its own. See nginx-security-headers.conf for
    # why: nginx drops inherited `add_header` directives in any block that
    # declares one, so a lone `add_header Cache-Control` silently removes the
    # CSP. Every `include` below is load-bearing; none is redundant.
    include /etc/nginx/conf.d/security-headers.conf;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Increase timeout for uploads
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Increase max body size for file uploads
        client_max_body_size 10M;
    }

    # Proxy uploaded files to backend (^~ gives priority over regex locations)
    location ^~ /uploads/ {
        proxy_pass http://backend:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache uploaded files
        expires 7d;
        add_header Cache-Control "public";
        # Required: the line above would otherwise drop every security header
        # from an image response. nosniff matters most here - these are bytes a
        # user uploaded, served from the app's own origin.
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/conf.d/security-headers.conf;
    }

    # Disable cache for index.html
    #
    # `location /` above rewrites every SPA route here internally, so this block
    # governs the headers on the document that loads the entire application.
    # Without the include, that document had no CSP at all.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        include /etc/nginx/conf.d/security-headers.conf;
    }
}
