name: CI

# Gate policy
#
# Jobs here BLOCK on failure. The previous version of this workflow marked seven
# steps `continue-on-error: true`, including both test suites and the backend build,
# so CI reported green while the backend did not compile and neither suite ran. That
# is how a broken `docker compose build` reached main unnoticed.
#
# Two jobs are deliberately advisory, each with its reason stated at the job.
# Anything else that cannot pass should be fixed or removed, not silenced.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  boundaries:
    name: Platform boundaries
    runs-on: ubuntu-latest
    # Complements the secret scan below rather than duplicating it. Gitleaks
    # cannot tell a platform Stripe key from a tenant one - both are sk_live_ -
    # so the boundary this guard enforces is the variable name. The platform
    # billing prefix belongs to the console's environment and must never be
    # referenced here; see docs/HOSTING.md.
    steps:
      - uses: actions/checkout@v4
      - run: sh scripts/ci/check-platform-boundaries.sh

  frontend:
    name: "Frontend: lint, typecheck, test, build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      # `tsc -b`, not `tsc --noEmit`. The root tsconfig sets "files": [] with project
      # references, so --noEmit compiles an empty file list and always passes.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 7

  backend:
    name: "Backend: typecheck, test, build"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stewardpos_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DB_ADAPTER: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: stewardpos_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: test-secret-min-32-characters-long-for-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # The backend uses npm and its own lockfile; the frontend uses pnpm.
      - name: Install
        working-directory: ./backend
        run: npm ci

      # Backend source had never been linted: with no flat config of its own,
      # ESLint walked up to the root's browser/React one and crashed instead of
      # running. `backend/eslint.config.js` fixes that, and this step is what
      # stops it silently rotting again.
      - name: Lint
        working-directory: ./backend
        run: npm run lint

      - name: Typecheck
        working-directory: ./backend
        run: npm run typecheck

      - name: Migrate
        working-directory: ./backend
        run: npm run migrate

      - name: Unit tests
        working-directory: ./backend
        run: npm run test:coverage

      # Adapter SQL against the migrated Postgres above. These BLOCK: the
      # adapters were the least-covered code in the repo (0.17%) because route
      # tests mock them, and the very first integration test written found an
      # unescaped LIKE wildcard that made a search for "%" return the whole
      # catalog. A mocked adapter cannot see that.
      #
      # The harness refuses to run unless DB_NAME contains "test", so a stray
      # environment cannot point these at real data.
      #
      # `test:integration` runs with --no-file-parallelism: these share one
      # database and several touch global state (the settings singleton, the
      # one-open-drawer index), so running the files concurrently makes them
      # collide with each other rather than test anything.
      - name: Adapter integration tests
        working-directory: ./backend
        run: npm run test:integration

      # `npm run build` is tsc. This is the step that was failing on 341 type errors
      # while CI reported green, which left the published image stale.
      - name: Build
        working-directory: ./backend
        run: npm run build

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Catches the class of failure that let a stale backend image keep serving:
      # the source compiled under tsx at runtime but `docker compose build` did not.
      - name: Build images
        run: docker compose build

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # Blocking, unlike the dependency audit below.
    #
    # The two fail for opposite reasons. `npm audit` goes red when someone
    # else publishes an advisory, which can happen to a commit that was green an
    # hour earlier and says nothing about the change under review - so it is
    # advisory. A secret in the diff is caused by the change under review, is
    # reproducible, and is the one class of mistake that cannot be undone after
    # the fact: once it is pushed to a public repository it is published, and
    # deleting it in the next commit does not unpublish it. That is worth
    # stopping at the gate.
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history. The default shallow clone would scan only the tip and
          # miss exactly the shape this is here to catch: a secret committed,
          # noticed, and deleted in a follow-up commit, still readable in the
          # history behind it.
          fetch-depth: 0

      - name: Scan history for secrets
        # Pinned to an exact version, not :latest. `.gitleaks.toml`'s allowlist
        # was tuned against this release; a scanner that silently updates itself
        # can start reporting a different set of findings on a commit nobody
        # touched, which is how a blocking job earns a reputation for crying
        # wolf and stops being read.
        uses: docker://zricethezav/gitleaks:v8.30.1
        with:
          args: >-
            detect
            --source=.
            --config=.gitleaks.toml
            --redact
            --no-banner
            --verbose

  security:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    # Advisory: results depend on upstream advisories published after a commit lands,
    # so a blocking gate here would turn red without any change to this repo.
    # Review the output; do not treat a green run as an all-clear.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Audit frontend
        run: pnpm audit --audit-level=moderate
      - name: Install backend
        working-directory: ./backend
        run: npm ci
      - name: Audit backend
        working-directory: ./backend
        run: npm audit --audit-level=moderate

  e2e:
    name: E2E
    # Part of the merge gate.
    #
    # e2e/global-setup.ts signs in as admin@demo.local before any spec runs, which
    # needs a migrated database seeded with that account. That was the whole reason
    # this job could not run: the stack came up with AUTO_SEED unset, so the account
    # did not exist and every spec failed in setup. The entrypoint already migrates
    # and seeds — it just needed asking.
    #
    # Previously ran on every PR with `continue-on-error: true`: a job that always
    # failed and was always ignored, which is worse than not running it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps

      - name: Start stack
        env:
          # The fixture the specs need. Without it the stack comes up with an
          # empty database and global-setup cannot sign in.
          AUTO_SEED: 'true'
        run: |
          docker compose up -d --build
          timeout 120 sh -c 'until curl -fsS http://localhost:3002/api/health >/dev/null; do sleep 3; done'
          # Health only means the server is listening. Wait for the seed to have
          # landed, or global-setup races it and fails on a missing account.
          timeout 120 sh -c 'until curl -fsS -X POST http://localhost:3002/api/auth/login             -H "Content-Type: application/json"             -d "{\"email\":\"admin@demo.local\",\"password\":\"DemoPass!1\"}"             | grep -q token; do sleep 3; done'

      - name: Show backend logs on failure
        if: failure()
        run: docker compose logs backend | tail -50

      - name: Run Playwright specs
        run: pnpm run test:e2e

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
