name: CI

# Gate policy
#
# Jobs here BLOCK on failure. The previous version of this workflow marked seven
# steps `continue-on-error: true`, including both test suites and the backend build,
# so CI reported green while the backend did not compile and neither suite ran. That
# is how a broken `docker compose build` reached main unnoticed.
#
# Two jobs are deliberately advisory, each with its reason stated at the job.
# Anything else that cannot pass should be fixed or removed, not silenced.

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  frontend:
    name: "Frontend: lint, typecheck, test, build"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      # `tsc -b`, not `tsc --noEmit`. The root tsconfig sets "files": [] with project
      # references, so --noEmit compiles an empty file list and always passes.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm run test:coverage

      - name: Build
        run: pnpm run build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 7

  backend:
    name: "Backend: typecheck, test, build"
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stewardpos_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DB_ADAPTER: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: stewardpos_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: test-secret-min-32-characters-long-for-ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # The backend uses npm and its own lockfile; the frontend uses pnpm.
      - name: Install
        working-directory: ./backend
        run: npm ci

      - name: Typecheck
        working-directory: ./backend
        run: npm run typecheck

      - name: Migrate
        working-directory: ./backend
        run: npm run migrate

      - name: Unit tests
        working-directory: ./backend
        run: npm run test:coverage

      # `npm run build` is tsc. This is the step that was failing on 341 type errors
      # while CI reported green, which left the published image stale.
      - name: Build
        working-directory: ./backend
        run: npm run build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      # Catches the class of failure that let a stale backend image keep serving:
      # the source compiled under tsx at runtime but `docker compose build` did not.
      - name: Build images
        run: docker compose build

  security:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    # Advisory: results depend on upstream advisories published after a commit lands,
    # so a blocking gate here would turn red without any change to this repo.
    # Review the output; do not treat a green run as an all-clear.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Audit frontend
        run: pnpm audit --audit-level=moderate
      - name: Install backend
        working-directory: ./backend
        run: npm ci
      - name: Audit backend
        working-directory: ./backend
        run: npm audit --audit-level=moderate

  e2e:
    name: E2E (manual)
    # Manual only, and not part of the merge gate.
    #
    # e2e/global-setup.ts signs in as admin@demo.local before any spec runs, which
    # needs a migrated database seeded with that account. CI has no such fixture, so
    # every spec fails in setup. Previously this ran on every PR with
    # `continue-on-error: true` — a job that always failed and was always ignored.
    #
    # Phase 7 builds the seeded stack these specs need; wire this into the gate then.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps

      - name: Start stack
        run: |
          docker compose up -d --build
          timeout 120 sh -c 'until curl -fsS http://localhost:3002/api/health >/dev/null; do sleep 3; done'

      - name: Run Playwright specs
        run: pnpm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
