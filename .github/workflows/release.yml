# Publish container images when a version tag is pushed.
#
# So an operator can `pull` rather than `build`. Building on the box works and
# stays supported, but it needs the source, a toolchain and several minutes of
# CPU on a machine that is often the shop's only server.
#
#   git tag -a v1.0.0 -m "StewardPOS 1.0.0"
#   git push origin v1.0.0
#
# Then, on the server:
#   IMAGE_TAG=1.0.0 docker compose -f docker-compose.prod.yml up -d
#
# Nothing here fires on a branch push. Publishing is a deliberate act.

name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # The tag is not trustworthy on its own — it can be pushed at any commit,
  # including one that does not build. Everything else here depends on this.
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: stewardpos_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DB_ADAPTER: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: stewardpos_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: test-secret-min-32-characters-long-for-ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        working-directory: ./backend
        run: npm ci

      - name: Typecheck, lint, test, build
        working-directory: ./backend
        run: |
          npm run typecheck
          npm run lint
          npm test
          npm run build

      - name: Migrate the test database
        working-directory: ./backend
        run: npm run migrate

      - name: Integration tests
        working-directory: ./backend
        run: npm run test:integration

      # A tag whose version does not match what the code says it is produces
      # images labelled one thing and reporting another.
      - name: The tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./backend/package.json').version")"
          UI="$(node -p "require('./package.json').version")"
          echo "tag=$TAG  backend=$PKG  frontend=$UI"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$UI" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($PKG / $UI). Bump the versions, or tag the right commit."
            exit 1
          fi

      # A release whose changelog does not mention it is a release nobody can
      # read about.
      - name: The changelog mentions this version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if ! grep -q "\[$TAG\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for [$TAG]."
            exit 1
          fi

  images:
    name: Build and push images
    needs: verify
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - name: frontend
            context: .
            dockerfile: ./Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Sign in to the registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}
          # `latest` only for a full release. A release candidate that claimed it
          # would be pulled by anyone who had not pinned a version, which is the
          # opposite of what a candidate is for.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The frontend bakes its API base URL at build time. Empty means the
          # SPA calls `/api` relative to whatever origin served it, which is what
          # the production stack does — and is the only value that lets one image
          # serve every domain.
          build-args: |
            VITE_API_BASE_URL=

  release:
    name: Draft the release notes
    needs: images
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A draft, not a publish: the notes are worth a human read before they
          # are the first thing anyone sees.
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "$GITHUB_REF_NAME" \
            --notes "See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${GITHUB_REF_NAME}/CHANGELOG.md).

          ## Container images

          \`\`\`
          ghcr.io/${{ github.repository }}-backend:${GITHUB_REF_NAME#v}
          ghcr.io/${{ github.repository }}-frontend:${GITHUB_REF_NAME#v}
          \`\`\`

          Run them with:

          \`\`\`bash
          IMAGE_TAG=${GITHUB_REF_NAME#v} docker compose -f docker-compose.prod.yml up -d
          \`\`\`

          See [docs/guides/install-vps.md](https://github.com/${{ github.repository }}/blob/${GITHUB_REF_NAME}/docs/guides/install-vps.md)."
