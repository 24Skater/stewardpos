# Automated dependency updates.
#
# The CI `security` job runs `pnpm audit` / `npm audit` and is deliberately
# advisory — it reports what upstream has published, and cannot fix anything.
# This is the half that fixes things.
#
# Grouped rather than one pull request per package. This repository has ~60
# direct dependencies across three ecosystems; ungrouped, a quiet week produces
# a dozen PRs, each needing a full CI run, and the security-relevant one gets
# lost among the patch bumps. Grouping makes the security updates the ones that
# arrive on their own.
version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "frontend"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # Security fixes travel alone so they can be reviewed and merged fast.
      # Everything else can wait for the weekly batch.
      frontend-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      # Majors are a deliberate, tested migration here, not a dependency bump —
      # see the vitest 4 note in vitest.config.ts, where the frontend stays on
      # 3.2.6 because 4 reads ~20pp lower and trips the coverage ratchet.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: "/backend"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["dependencies", "backend"]
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      backend-minor-and-patch:
        applies-to: version-updates
        update-types: ["minor", "patch"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "ci"

  # The images the Compose stack and the Dockerfile pull. A pinned base image
  # is the dependency people forget they have.
  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(docker)"
